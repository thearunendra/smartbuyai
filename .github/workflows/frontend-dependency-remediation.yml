name: Frontend dependency remediation (temporary)

on:
  push:
    branches: [fix/core-search-reliability]
    paths:
      - ".github/workflows/frontend-dependency-remediation.yml"

permissions:
  contents: write

jobs:
  update-lockfile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/core-search-reliability

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Upgrade npm to the current major
        run: |
          npm install --global npm@11
          npm --version

      - name: Apply compatible frontend dependency fixes
        run: |
          npm ci
          npm audit fix || true
          npm audit --json > /tmp/frontend-audit.json || true
          node -e 'const r=require("/tmp/frontend-audit.json"); console.log("Frontend vulnerabilities after npm 11:", r.metadata?.vulnerabilities?.total ?? "unknown")'
          npm run lint
          npm test
          npm run build

      - name: Commit verified frontend lockfile
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "Update patched frontend dependency lockfile"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo "No compatible frontend lockfile updates were produced."
          fi
