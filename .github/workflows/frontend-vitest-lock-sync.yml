name: Frontend Vitest lockfile sync (temporary)

on:
  push:
    branches: [fix/core-search-reliability]
    paths:
      - ".github/workflows/frontend-vitest-lock-sync.yml"

permissions:
  contents: write

jobs:
  update-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/core-search-reliability

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Use npm 11 and regenerate lockfile
        working-directory: frontend
        run: |
          npm install --global npm@11
          npm install --package-lock-only --ignore-scripts
          npm ci
          npm audit --json > /tmp/frontend-audit.json || true
          node -e '
            const report = require("/tmp/frontend-audit.json");
            const v = report.metadata?.vulnerabilities || {};
            console.log("Frontend npm audit:", JSON.stringify(v));
            if ((v.high || 0) > 0) process.exit(1);
          '
          npm run lint
          npm test
          npm run build

      - name: Commit lockfile and remove this temporary workflow
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json
          git rm .github/workflows/frontend-vitest-lock-sync.yml
          git commit -m "Patch Vitest dependencies and remove temporary workflow"
          git push origin "HEAD:${GITHUB_REF_NAME}"
