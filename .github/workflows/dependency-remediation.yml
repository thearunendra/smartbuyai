name: Dependency remediation (temporary)

on:
  push:
    branches: [fix/core-search-reliability]
    paths:
      - ".github/workflows/dependency-remediation.yml"

permissions:
  contents: write

jobs:
  update-lockfiles:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/core-search-reliability

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply compatible backend dependency fixes
        working-directory: backend
        run: |
          npm ci
          npm audit fix || true
          npm test -- --runInBand
          npm audit --json > /tmp/backend-audit.json || true
          node -e 'const r=require("/tmp/backend-audit.json"); console.log("Backend vulnerabilities after compatible fixes:", r.metadata?.vulnerabilities?.total ?? "unknown")'

      - name: Apply compatible frontend dependency fixes
        working-directory: frontend
        run: |
          npm ci
          npm audit fix || true
          npm run lint
          npm test
          npm run build
          npm audit --json > /tmp/frontend-audit.json || true
          node -e 'const r=require("/tmp/frontend-audit.json"); console.log("Frontend vulnerabilities after compatible fixes:", r.metadata?.vulnerabilities?.total ?? "unknown")'

      - name: Commit verified lockfile updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/package-lock.json frontend/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "Update vulnerable transitive dependency lockfiles"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo "No compatible lockfile updates were produced."
          fi
