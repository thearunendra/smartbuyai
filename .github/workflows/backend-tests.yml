name: Backend tests

on:
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-tests.yml"
  push:
    branches: [main, "fix/**"]
    paths:
      - "backend/**"
      - ".github/workflows/backend-tests.yml"

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js (Render runtime)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      # The production-only audit is the blocking security gate.
      # The full tree audit also includes Jest's dev-only dependency chain;
      # keep its findings visible without blocking a production-safe release
      # when upstream has not published a patched development dependency yet.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=low

      - name: Report all backend dependency audit findings
        id: audit-all
        continue-on-error: true
        run: npm audit --audit-level=low

      - name: Explain development dependency audit findings
        if: steps.audit-all.outcome == 'failure'
        run: echo "::warning::Production dependency audit passed. Full-tree audit findings remain in development dependencies; review and update the test toolchain when a patched upstream release is available."

      - name: Run backend tests
        run: npm test -- --runInBand

      - name: Run backend coverage
        run: npm run test:coverage
