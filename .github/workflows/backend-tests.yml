name: Backend tests

on:
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-tests.yml"
  push:
    branches: [main, "fix/**"]
    paths:
      - "backend/**"
      - ".github/workflows/backend-tests.yml"

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Report dependency audit findings
        shell: bash
        run: |
          npm audit --json > /tmp/npm-audit.json || true
          node -e '
            const report = require("/tmp/npm-audit.json");
            const entries = Object.entries(report.vulnerabilities || {});
            console.log(`Total: ${report.metadata?.vulnerabilities?.total ?? entries.length}`);
            for (const [name, item] of entries) {
              console.log(`${item.severity.toUpperCase()} ${name} | direct=${item.isDirect} | range=${item.range} | fix=${JSON.stringify(item.fixAvailable)}`);
            }
          '

      - name: Run backend tests
        run: npm test -- --runInBand
