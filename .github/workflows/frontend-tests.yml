name: Frontend tests

on:
  pull_request:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-tests.yml"
  push:
    branches: [main, "fix/**"]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-tests.yml"

permissions:
  contents: read

jobs:
  frontend-checks:
    # A one-off lockfile sync commit is validated by its dedicated workflow.
    if: ${{ !contains(github.event.head_commit.message, '[sync-vitest-lock]') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Report dependency audit findings
        shell: bash
        run: |
          npm audit --json > /tmp/npm-audit.json || true
          node -e '
            const report = require("/tmp/npm-audit.json");
            const entries = Object.entries(report.vulnerabilities || {});
            console.log(`Total: ${report.metadata?.vulnerabilities?.total ?? entries.length}`);
            for (const [name, item] of entries) {
              console.log(`${item.severity.toUpperCase()} ${name} | direct=${item.isDirect} | range=${item.range} | fix=${JSON.stringify(item.fixAvailable)}`);
            }
          '

      - name: Run ESLint
        run: npm run lint

      - name: Run frontend tests
        run: npm test

      - name: Build frontend
        run: npm run build
