# Render Blueprint: creates the backend API and the frontend site.
# Render -> New -> Blueprint -> pick this repository. Values marked
# `sync: false` are asked for once when the Blueprint is created.

services:
  # Backend API (Express)
  - type: web
    name: smartbuy-ai-api
    runtime: node
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: GEMINI_API_KEY
        sync: false
      - key: SERPER_API_KEY
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      # The frontend's address, e.g. https://smartbuy-ai.onrender.com
      - key: CORS_ORIGINS
        sync: false
      # Random secret for login tokens, generated by Render.
      - key: JWT_SECRET
        generateValue: true

  # Frontend (React + Vite static site)
  - type: web
    name: smartbuy-ai
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    # Send every path to the React app so page refreshes work.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "20"
      # The backend's address, e.g. https://smartbuy-ai-api.onrender.com
      - key: VITE_API_URL
        sync: false
